baseURL = "https://go-hocon.github.io/"
title = "go-hocon"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Lexer & parser"
  status = "ready"
  blurb = "Unquoted keys and strings, `=` / `:`, optional commas and root braces, `#` and `//` comments, dotted-path keys, triple-quoted strings and unicode escapes — the full HOCON surface over JSON."
[[params.phases]]
  name = "Merging & concatenation"
  status = "ready"
  blurb = "Deep object merge of duplicate keys, array and value concatenation, and `+=` self-append, applied as the tree is built."
[[params.phases]]
  name = "Substitutions"
  status = "ready"
  blurb = "`${path}` and optional `${?path}` substitutions with environment fallback and self-reference, resolved after the whole tree is assembled."
[[params.phases]]
  name = "Includes & environment seams"
  status = "ready"
  blurb = "`include` directives and environment lookups run through injectable `WithIncludeResolver` / `WithEnv` seams — no filesystem or process environment needed, in production or in tests."
[[params.phases]]
  name = "Typed access & rendering"
  status = "ready"
  blurb = "`GetString` / `GetInt` / `GetFloat` / `GetBool` / `GetDuration` / `GetBytes` / `GetList` / `GetObject` / `GetOrElse` / `HasPath` over dotted paths, `WithFallback`, and `Render` back to HOCON or JSON."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 9.93:1, bright on the dark background 3.07:1.
  base = "#3730a3"
  deep = "#221d63"
  bright = "#4f46e5"
  shadow = "rgba(55,48,163,.7)"
  glow = "rgba(55,48,163,.6)"
  wash = "rgba(55,48,163,.10)"
  washDeep = "rgba(34,29,99,.06)"
  chipBg = "#eae9fc"
  chipBorder = "#cac8f7"
  chipFg = "#221d63"
  chipBgDark = "rgba(79,70,229,.14)"
  chipBorderDark = "rgba(79,70,229,.32)"
  chipFgDark = "#9e99f1"
  statsEnd = "#d5d3f9"
  bandText = "#e3e1fb"
